name: Localized Codex 0.166.0

on:
  push:
    branches: [up/cli-pt-br-0166]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: localized-cli-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_BUILD_JOBS: "2"

jobs:
  i18n-checks:
    name: Check the localization contract
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install native check dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libcap-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt, clippy
      - name: Restore compiler and dependency cache
        id: cargo_cache
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            codex-rs/target
          key: localized-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-1.95-${{ hashFiles('codex-rs/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            localized-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-1.95-${{ hashFiles('codex-rs/Cargo.lock') }}-
      - uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-unknown-linux-gnu
      - name: Check formatting
        run: cargo fmt -p codex-tui -- --config imports_granularity=Item --check
      - name: Check localization and TUI types
        run: cargo clippy --locked -p codex-tui --lib -- -D warnings
      - name: Test localization
        run: cargo test --locked -p codex-tui i18n --lib
      - name: Test localized package assembly
        working-directory: .github/scripts
        run: python3 -m unittest test_package_localized_cli.py

      - name: Save compiler and dependency cache
        if: ${{ always() && !cancelled() && steps.cargo_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            codex-rs/target
          key: localized-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-1.95-${{ hashFiles('codex-rs/Cargo.lock') }}-${{ github.sha }}

  macos-arm64:
    name: Build the complete macOS ARM64 package
    # Public Intel runners have 14 GB RAM; do not select a paid larger runner.
    runs-on: macos-15-intel
    timeout-minutes: 180
    defaults:
      run:
        working-directory: codex-rs
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: "packed"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Verify the source and unchanged protocol version
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 6ff1e1ca3b30fc8b914720681fcf5fe62e95f856 HEAD
          python3 - <<'PY'
          import pathlib, re
          source = pathlib.Path("Cargo.toml").read_text()
          assert re.search(r'^version = "0\.166\.0"$', source, re.M), "Cargo version must remain 0.166.0"
          assert pathlib.Path("tui/src/i18n.rs").is_file(), "localized source is required"
          PY
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: aarch64-apple-darwin
      - name: Configure the Apple ARM cross compiler
        run: |
          set -euo pipefail
          sdk="$(xcrun --sdk macosx --show-sdk-path)"
          {
            echo "SDKROOT=$sdk"
            echo "CC_aarch64_apple_darwin=$(xcrun --find clang)"
            echo "CXX_aarch64_apple_darwin=$(xcrun --find clang++)"
            echo "AR_aarch64_apple_darwin=$(xcrun --find ar)"
            echo "CFLAGS_aarch64_apple_darwin=-arch arm64 -isysroot $sdk"
            echo "CXXFLAGS_aarch64_apple_darwin=-arch arm64 -isysroot $sdk"
            echo "CARGO_TARGET_AARCH64_APPLE_DARWIN_LINKER=$(xcrun --find clang)"
            echo "CARGO_TARGET_AARCH64_APPLE_DARWIN_RUSTFLAGS=-C link-arg=-arch -C link-arg=arm64 -C link-arg=-isysroot -C link-arg=$sdk"
            echo "STABLE_GIT_COMMIT=$(git rev-parse HEAD)"
          } >> "$GITHUB_ENV"
      - name: Restore compiler and dependency cache
        id: cargo_cache
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            codex-rs/target
          key: localized-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-1.95-${{ hashFiles('codex-rs/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            localized-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-1.95-${{ hashFiles('codex-rs/Cargo.lock') }}-
      - uses: ./.github/actions/setup-rusty-v8
        with:
          target: aarch64-apple-darwin
      - name: Fetch and verify the pinned complete official package
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/codex-package-aarch64-apple-darwin.tar.gz"
          curl --fail --location --retry 3 \
            https://github.com/openai/codex/releases/download/rust-v0.166.0/codex-package-aarch64-apple-darwin.tar.gz \
            --output "$archive"
          echo "55a440cb579f970abe7c79ab181e54b0ea4c419be99f333bbd868eebac9c21f0  $archive" | shasum -a 256 --check -
      - name: Compile the localized CLI
        run: cargo build --locked --release --target aarch64-apple-darwin -p codex-cli --bin codex --timings
      - name: Verify architecture and apply a local ad hoc signature
        run: |
          set -euo pipefail
          binary=target/aarch64-apple-darwin/release/codex
          [[ "$(lipo -archs "$binary")" == "arm64" ]]
          xcrun strip -x "$binary"
          codesign --force --sign - --entitlements ../.github/scripts/macos-signing/codex.entitlements.plist "$binary"
          codesign --verify --strict "$binary"
          actual="$RUNNER_TEMP/localized-cli-entitlements.plist"
          codesign -d --entitlements :- "$binary" > "$actual"
          python3 - ../.github/scripts/macos-signing/codex.entitlements.plist "$actual" <<'PYCODE'
          import plistlib, sys
          expected = plistlib.load(open(sys.argv[1], "rb"))
          actual = plistlib.load(open(sys.argv[2], "rb"))
          assert actual == expected, "Localized CLI entitlements must match the official policy"
          PYCODE
          file "$binary"
      - name: Preserve official helpers, audio runtime and package resources
        working-directory: .
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/codex-package-aarch64-apple-darwin.tar.gz"
          python3 .github/scripts/package_localized_cli.py \
            --official-archive "$archive" \
            --binary codex-rs/target/aarch64-apple-darwin/release/codex \
            --output-dir "$RUNNER_TEMP/localized-cli"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codex-pt-BR-0.166.0-aarch64-apple-darwin
          path: ${{ runner.temp }}/localized-cli/*
          if-no-files-found: error
          retention-days: 14
      - name: Retain build timings
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: localized-cli-build-timings
          path: codex-rs/target/cargo-timings/
          if-no-files-found: ignore
      - name: Save compiler and dependency cache
        if: ${{ always() && !cancelled() && steps.cargo_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            codex-rs/target
          key: localized-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-1.95-${{ hashFiles('codex-rs/Cargo.lock') }}-${{ github.sha }}
